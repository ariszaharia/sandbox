name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Sandbox containers are created with --pull=never, so the images have to exist first.
      - run: sh runtimes/build.sh
      # Runs the adversarial suite against the real Docker daemon on the runner.
      - run: ./mvnw -B verify
